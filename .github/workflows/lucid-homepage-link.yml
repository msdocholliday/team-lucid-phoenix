name: Lucid homepage link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucid-homepage-link.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture homepage contribution markup
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          marker = 'unfinished-constellation.html'
          pos = source.find(marker)
          if pos < 0:
              raise SystemExit('Could not find Astra contribution link')
          start = max(0, pos - 7000)
          end = min(len(source), pos + 10000)
          Path('_lucid-home-snippet.txt').write_text(source[start:end], encoding='utf-8')
          PY
      - name: Commit inspection snippet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _lucid-home-snippet.txt
          git commit -m "Temporary: inspect homepage contribution markup" || exit 0
          git push
