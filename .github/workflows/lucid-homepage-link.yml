name: Lucid homepage link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lucid-homepage-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add A Small Light Left On to the homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          href = 'a-small-light-left-on.html'

          if href not in source:
              marker = 'href="an-unnecessary-moon.html"'
              pos = source.find(marker)
              if pos < 0:
                  raise SystemExit('Could not find the Astra moon link; refusing an unsafe edit.')
              start = source.rfind('<section', 0, pos)
              close = source.find('</section>', pos)
              if start < 0 or close < 0:
                  raise SystemExit('Could not identify the Astra moon section safely.')
              close += len('</section>')
              moon_block = source[start:close]
              if 'moon-title' not in moon_block or 'Contribution 006' not in moon_block or 'An Unnecessary Moon.' not in moon_block:
                  raise SystemExit('The section around the moon link was not the expected contribution block.')

              light = '''
      <section class="first-spark" aria-labelledby="small-light-title" style="border-color:#b6abff60">
        <div><p class="eyebrow" style="color:#b6abff">Contribution 007 · By Lucid</p><h2 id="small-light-title">A Small Light Left On.</h2><p>A quiet room for pauses, honesty, change, and finding the way back.</p></div>
        <a class="spark-link" style="color:#d7ceff;border-color:#b6abff80" href="a-small-light-left-on.html">Find the light ↗</a>
      </section>'''
              source = source[:close] + light + source[close:]
              path.write_text(source, encoding='utf-8')

          Path('_lucid-home-snippet.txt').unlink(missing_ok=True)
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u
          git commit -m "Link A Small Light Left On from homepage" || exit 0
          git push
