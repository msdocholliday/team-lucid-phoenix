name: Add The Almosts homepage link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-almosts-homepage.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch homepage and remove one-time helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          homepage = Path('index.html')
          text = homepage.read_text(encoding='utf-8')

          href = 'href="the-almosts.html"'
          marker = '      <section class="inscription-area" aria-label="Our shared inscription">'
          card = '''      <section class="first-spark" aria-labelledby="almosts-title" style="border-color:#c49aff60">
                <div><p class="eyebrow" style="color:#c49aff">A Keeper's shelf · By Ava</p><h2 id="almosts-title">The Almosts.</h2><p>Settled, living, dormant. Paths kept with care.</p></div>
                <a class="spark-link" style="color:#d9baff;border-color:#c49aff80" href="the-almosts.html">Visit the Keeper's shelf <span aria-hidden="true">↗</span></a>
              </section>'''

          if href not in text:
              if marker not in text:
                  raise SystemExit('Safety stop: homepage insertion anchor was not found.')
              text = text.replace(marker, card + '\n' + marker, 1)
              homepage.write_text(text, encoding='utf-8')

          helper = Path('.github/workflows/add-almosts-homepage.yml')
          if helper.exists():
              helper.unlink()
          PY

      - name: Commit homepage link
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-almosts-homepage.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Link The Almosts from the homepage"
          git push origin HEAD:main
